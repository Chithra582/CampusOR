name: counter-dispatcher
description: Route waiting tokens to active service counters and balance workload.
input_schema:
  type: object
  properties:
    counter_id:
      type: string
      description: Target service window or counter identifier.
    action:
      type: string
      enum: [assign_next, pause, resume, reassign_all]
      description: Dispatcher operation to perform.
    service_type:
      type: string
      description: Type of service provided by this counter.
  required:
    - counter_id
    - action
